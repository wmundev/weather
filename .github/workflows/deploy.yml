name: Deploy to AWS

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ main ]

concurrency:
  group: deploy-to-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: actions/checkout@v7
        with:
          # A workflow_run event checks out the latest commit on main by default, which is not
          # necessarily the commit CI just verified - another push may have landed while CI ran.
          # Pin to the verified commit; a manual dispatch has no workflow_run and falls back to
          # the dispatched ref.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Install AWS .NET Deployment Tool
        run: dotnet tool install --global AWS.Deploy.Tools --version 2.0.4

      - name: Execute Deployment
        env:
          CONFIG_CAT_SDK_KEY_PROD: ${{ secrets.CONFIG_CAT_SDK_KEY_PROD }}
        run: |
          bash ci-scripts/setup_env.sh
          dotnet aws deploy --silent --project-path "weather-backend/weather-backend.csproj" --apply "../weather-backend.Deployment/appsettings.json" --deployment-project "../weather-backend.Deployment"
